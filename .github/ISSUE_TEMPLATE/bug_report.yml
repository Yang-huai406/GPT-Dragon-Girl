name: 缺陷反馈 / Bug report
description: GPT小龙娘窗口、费用、设置或安装问题 / Window, accounting, settings or installation issues.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请勿提交密钥、认证文件、完整聊天日志或未脱敏截图。 / Do not include secrets, authentication files, full chats or unredacted screenshots.
  - type: textarea
    id: environment
    attributes:
      label: 环境 / Environment
      description: 插件、系统、Codex、Node.js 版本，显示器与缩放，全新安装或升级。 / Plugin, OS, Codex and Node.js versions; displays, scaling; fresh install or upgrade.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 说明操作顺序及发生频率。 / Include the action sequence and frequency.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果 / Expected and actual results
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的补充信息 / Redacted evidence
      description: 错误类别、相关时间或裁剪后的截图；不需要真实账户。 / Error category, timing or cropped screenshots; real account details are unnecessary.
