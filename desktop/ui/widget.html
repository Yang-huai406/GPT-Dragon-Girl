<!doctype html>
<html lang="zh-CN" class="desktop">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="panels.brand">GPT小龙娘</title><link rel="stylesheet" href="/ui.css">
<script src="/i18n-catalogs.js" defer></script><script src="/i18n.js" defer></script><script src="/client.js" defer></script><script src="/money.js" defer></script><script src="/bubble-layout.js" defer></script><script src="/render.js" defer></script><script src="/media-guard.js" defer></script><script src="/turn-notice.js" defer></script><script src="/account-notices.js" defer></script><script src="/gesture.js" defer></script><script src="/audio-engine.js" defer></script><script src="/preferences-v3.js" defer></script><script src="/account-view.js" defer></script><script src="/dsh-whale/widget.js" defer></script><script src="/shape.js" defer></script><script src="/gpt-fallback.js" defer></script><script src="/input.js" defer></script><script src="/insights.js" defer></script><script src="/workshop.js" defer></script><script src="/dashboard.js" defer></script><script src="/usage-history.js" defer></script>
</head><body>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form">
      <header class="dialog-header"><div><h2 id="settings-title" data-i18n="panels.settingsTitle">API 余额设置</h2><p data-i18n="panels.settingsIntro">自动跟随 Codex 的 API 配置，通常无需修改。</p></div><button type="button" id="close-settings" class="icon-button" aria-label="关闭 API 设置" data-i18n-aria-label="panels.closeSettings">×</button></header>
      <div class="settings-content">
      <div id="settings-error" class="notice" role="alert" hidden></div>
      <p class="help privacy-help" data-i18n="panels.privacyHelp">已有配置已隐藏。留空保留原值；填写新值才会修改。</p>
      <label><span data-i18n="panels.provider">余额接口</span><select name="provider"><option value="auto" data-i18n="panels.providerAuto">自动识别当前 API（推荐）</option><option value="billing" data-i18n="panels.providerBilling">兼容账单接口</option><option value="newapi" data-i18n="panels.providerQuota">兼容密钥额度接口</option><option value="custom-json" data-i18n="panels.providerCustom">自定义 JSON 余额接口</option><option value="deepseek" data-i18n="panels.providerNative">原生余额接口</option></select></label>
      <div class="field-grid"><label><span data-i18n="panels.baseUrl">API 地址</span><input name="baseUrl" type="url" placeholder="留空，跟随 Codex 当前配置" data-i18n-placeholder="panels.basePlaceholder"><small data-i18n="panels.domainHelp">更换域名须同时指定该服务的密钥环境变量。</small></label><label><span data-i18n="panels.keyEnv">密钥环境变量名</span><input name="keyEnv" placeholder="留空，使用 Codex 的现有密钥" data-i18n-placeholder="panels.keyPlaceholder" autocomplete="off"><small data-i18n="panels.keyHelp">只填变量名，例如 MY_API_KEY；不要填密钥。</small></label></div>
      <details><summary data-i18n="panels.customSettings">其他 API 与自定义接口</summary><div class="field-grid"><label><span data-i18n="panels.profile">Codex 配置方案（profile）</span><input name="profile" placeholder="默认方案" data-i18n-placeholder="panels.defaultProfile"></label><label><span data-i18n="panels.projectDir">项目目录（可选）</span><input name="projectDir" placeholder="读取该目录内的 .codex/config.toml" data-i18n-placeholder="panels.projectPlaceholder"></label><label><span data-i18n="panels.currency">自定义金额币种</span><input name="currency" maxlength="3" placeholder="USD"><small data-i18n="panels.billingCurrencyHelp">兼容账单接口固定为 USD。</small></label><label><span data-i18n="panels.dashboardUrl">账单页面地址</span><input name="dashboardUrl" type="url" placeholder="留空，使用当前服务商" data-i18n-placeholder="panels.dashboardPlaceholder"></label><label><span data-i18n="panels.balancePath">余额路径</span><input name="balancePath" placeholder="/api/account/balance"></label><label><span data-i18n="panels.balanceField">余额字段</span><input name="balanceField" placeholder="data.balance"></label><label><span data-i18n="panels.usedField">累计消耗字段（可选）</span><input name="usedField" placeholder="data.used"></label><label><span data-i18n="panels.balanceScale">金额换算系数</span><input name="balanceScale" type="number" min="0.000000001" step="any"></label><label><span data-i18n="panels.billingDivisor">账单用量除数</span><input name="billingUsageDivisor" type="number" min="0.000001" step="any"><small data-i18n="panels.billingDivisorHelp">账单用量以美分返回时使用 100；请按接口文档调整。</small></label><label><span data-i18n="panels.quotaPerUnit">每货币单位的 quota</span><input name="quotaPerUnit" type="number" min="0.000001" step="any"><small data-i18n="panels.quotaHelp">仅用于返回原始 quota 的接口。</small></label></div></details>
      <details><summary data-i18n="panels.pricingSettings">每轮费用估算（可选）</summary><p class="help" data-i18n="panels.pricingHelp">未配置价格时，显示本轮期间观测到的 API 扣费；它可能包含同密钥的其他调用。配置价格后，按 Codex token 记录估算。价格单位是每百万 token，币种使用上方设置。留空保留全部现有价格；填写模型及完整价格只更新该模型。</p><label><span data-i18n="panels.priceModel">模型名称</span><input name="priceModel" autocomplete="off" placeholder="与 Codex 的模型名称完全一致" data-i18n-placeholder="panels.modelPlaceholder"></label><div class="field-grid"><label><span data-i18n="panels.priceInput">输入价格</span><input name="priceInput" type="number" min="0" step="any" placeholder="留空保持原值" data-i18n-placeholder="panels.keepPlaceholder"></label><label><span data-i18n="panels.priceCached">缓存命中价格</span><input name="priceCached" type="number" min="0" step="any" placeholder="留空保持原值" data-i18n-placeholder="panels.keepPlaceholder"></label><label><span data-i18n="panels.priceOutput">输出价格</span><input name="priceOutput" type="number" min="0" step="any" placeholder="留空保持原值" data-i18n-placeholder="panels.keepPlaceholder"></label><label><span data-i18n="panels.priceWrite">缓存写入价格（可选）</span><input name="priceWrite" type="number" min="0" step="any" placeholder="与输入价格相同" data-i18n-placeholder="panels.inputPlaceholder"></label></div><label class="check"><input name="removePrice" type="checkbox"><span data-i18n="panels.removePrice">删除填写的模型价格</span></label></details>
      <label class="check"><input name="monitorSessions" type="checkbox"><span data-i18n="panels.monitorSessions">记录本机 token 用量与任务状态</span></label><p class="help" data-i18n="panels.monitorHelp">不发送聊天内容。使用会员账号？在菜单顶部切换到“Codex 订阅”，查看 5 小时与周额度。</p>
      </div>
      <div class="dialog-actions"><button type="button" id="cancel-settings" class="quiet" data-i18n="panels.cancel">取消</button><button type="submit" class="primary" data-i18n="panels.saveSettings">保存设置</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" hidden></div>
</body></html>
